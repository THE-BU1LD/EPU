name: Query-anchor V5 verification

on:
  pull_request:
    paths:
      - "research/query_anchor_v5/**"
      - ".github/workflows/query-anchor-v5.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/query_anchor_v5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile source
        run: python -m py_compile epu_research_system/v5/*.py epu_research_system/synthetic.py
      - name: Run focused tests
        run: python -m unittest discover -s epu_research_system/tests -p "test_v5.py" -v
